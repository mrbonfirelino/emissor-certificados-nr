{% extends "base.html" %}
{% block titulo %}Trocar senha — NormaTech{% endblock %}
{% block conteudo %}
<div class="login-box card">
  <h1>Trocar senha</h1>
  {% if obrigatoria %}<p class="sub">Você está usando uma senha provisória. Defina uma senha nova para continuar.</p>
  {% else %}<p class="sub">Defina uma senha nova.</p>{% endif %}
  <form method="post" action="/troca-senha">
    <div class="campo">
      <label for="atual">Senha atual</label>
      <input id="atual" name="atual" type="password" required>
    </div>
    <div class="campo">
      <label for="nova">Nova senha (mínimo 6 caracteres)</label>
      <input id="nova" name="nova" type="password" minlength="6" required>
    </div>
    <div class="campo">
      <label for="confirma">Confirmar nova senha</label>
      <input id="confirma" name="confirma" type="password" minlength="6" required>
    </div>
    <button type="submit" class="verde">Salvar nova senha</button>
  </form>
</div>
{% endblock %}
