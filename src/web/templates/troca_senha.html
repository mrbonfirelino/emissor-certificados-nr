{% extends "base.html" %}
{% block titulo %}Trocar senha — NormaTech{% endblock %}
{% block conteudo %}
<div class="login-box card">
  <h1>Trocar senha</h1>
  {% if obrigatoria %}<p class="sub">Você está usando uma senha provisória. Defina uma senha nova para continuar.</p>
  {% else %}<p class="sub">Defina uma senha nova.</p>{% endif %}
  <form method="post" action="/troca-senha">
    <div class="campo">
      <label for="atual">Senha atual</label>
      <div style="display:flex; gap:6px;">
        <input id="atual" name="atual" type="password" required style="flex:1;">
        <button type="button" class="btn cinza" onclick="_alternarSenha(this, 'atual')">Exibir</button>
      </div>
    </div>
    <div class="campo">
      <label for="nova">Nova senha (mínimo 6 caracteres)</label>
      <div style="display:flex; gap:6px;">
        <input id="nova" name="nova" type="password" minlength="6" required style="flex:1;">
        <button type="button" class="btn cinza" onclick="_alternarSenha(this, 'nova')">Exibir</button>
      </div>
    </div>
    <div class="campo">
      <label for="confirma">Confirmar nova senha</label>
      <div style="display:flex; gap:6px;">
        <input id="confirma" name="confirma" type="password" minlength="6" required style="flex:1;">
        <button type="button" class="btn cinza" onclick="_alternarSenha(this, 'confirma')">Exibir</button>
      </div>
    </div>
    <button type="submit" class="verde">Salvar nova senha</button>
  </form>
</div>
<script>
function _alternarSenha(btn, id) {
  var inp = document.getElementById(id);
  var mostrar = inp.type === "password";
  inp.type = mostrar ? "text" : "password";
  btn.textContent = mostrar ? "Ocultar" : "Exibir";
}
</script>
{% endblock %}
