{% extends "base.html" %}
{% block content %}
<h1>Novo Romaneio</h1>
<p class="sub">Serial gerado automaticamente na emissão. O romaneio não pode ser excluído — apenas bloqueado.</p>

<form method="post" action="/romaneios/novo" class="form-grid" id="form-romaneio">
  <h2>Dados do embarque</h2>
  <div class="form-grid romaneio-grid">
    <label>OS (ordem de serviço / descrição)
      <input type="text" name="os" placeholder="Ex.: 1234-5 — Montagem …">
    </label>
    <label>Cliente
      <input type="text" name="cliente">
    </label>
    <label>Nº ordem de compra
      <input type="text" name="ordem_compra">
    </label>
    <label>Data do embarque
      <input type="text" name="data_embarque" class="js-data" value="{{ hoje }}" placeholder="dd/mm/aaaa" required>
    </label>
  </div>

  <h2>Transporte</h2>
  <div class="form-grid romaneio-grid">
    <label>Transportadora
      <input type="text" name="transportadora">
    </label>
    <label>CNPJ / CPF da transportadora
      <input type="text" name="transportadora_doc">
    </label>
    <label>Veículo (modelo)
      <input type="text" name="veiculo">
    </label>
    <label>Placa
      <input type="text" name="placa" style="text-transform:uppercase" maxlength="10">
    </label>
    <label>Motorista
      <input type="text" name="motorista">
    </label>
  </div>

  <h2>Itens</h2>
  <div id="blocos"></div>
  <div class="acoes">
    <button type="button" class="btn" id="btn-outros">+ Bloco "Outros"</button>
  </div>

  <div class="acoes">
    <button type="submit" class="btn verde">Emitir romaneio</button>
    <a class="btn" href="/romaneios">Cancelar</a>
  </div>
</form>

<style>
  .romaneio-grid { grid-template-columns: repeat(3, 1fr); }
  .item-linha { display: grid; grid-template-columns: 110px 1fr 70px 90px 130px 100px 110px 1fr 32px; gap: 6px; margin-bottom: 6px; align-items: end; }
  .item-linha input { width: 100%; }
  .item-linha .rm { background: none; border: none; color: #c00; cursor: pointer; font-size: 16px; }
  .bloco-titulo { font-weight: 600; margin: 12px 0 6px; }
  @media (max-width: 900px) { .romaneio-grid { grid-template-columns: 1fr; } .item-linha { grid-template-columns: 1fr 1fr; } }
</style>

<script>
const BLOCOS_FIXOS = [[1, "EQUIPAMENTOS E COMPONENTES"], [2, "PARAFUSOS E COMPONENTES"], [3, "COMPONENTES"]];
let nOutros = 0;

function linhaItem(bloco, titulo) {
  const div = document.createElement("div");
  div.className = "item-linha";
  div.innerHTML = `
    <input type="hidden" name="bloco[]" value="${bloco}">
    <input type="hidden" name="bloco_titulo[]" value="${titulo}">
    <input name="codigo[]" placeholder="Código">
    <input name="descricao[]" placeholder="Descrição">
    <input name="unidade[]" placeholder="Un.">
    <input name="qtd[]" placeholder="Qtd">
    <input name="dimensoes[]" placeholder="Dimensões">
    <input name="peso[]" placeholder="Peso (kg)">
    <input name="tipo[]" placeholder="Tipo">
    <input name="observacoes[]" placeholder="Observações">
    <button type="button" class="rm" title="Remover linha" onclick="this.parentElement.remove()">✕</button>`;
  return div;
}

function addBlocoFixo(num, titulo, nItens) {
  const box = document.getElementById("blocos");
  const h = document.createElement("div");
  h.className = "bloco-titulo";
  h.textContent = `${num}. ${titulo}`;
  box.appendChild(h);
  for (let i = 0; i < nItens; i++) box.appendChild(linhaItem(num, titulo));
}
addBlocoFixo(1, BLOCOS_FIXOS[0][1], 4);
addBlocoFixo(2, BLOCOS_FIXOS[1][1], 4);
addBlocoFixo(3, BLOCOS_FIXOS[2][1], 4);

document.getElementById("btn-outros").addEventListener("click", () => {
  const titulo = prompt("Descrição do bloco 'Outros':", "OUTROS");
  if (!titulo) return;
  nOutros += 1;
  addBlocoFixo(3 + nOutros, titulo.toUpperCase(), 3);
});
</script>
{% endblock %}
